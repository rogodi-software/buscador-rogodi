<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotización ROGODI</title>
<style>
  :root { --rojo: #d81f26; --negro: #111; --gris: #666; --linea: #ccc; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #dcdcdc; font-family: Arial, Helvetica, sans-serif;
    color: var(--negro); -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }

  .barra {
    position: sticky; top: 0; z-index: 20; background: #1a1a1a; color: #fff;
    padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
    gap: 10px; flex-wrap: wrap;
  }
  .barra span { font-size: 13px; color: #ccc; }
  .barra button {
    background: var(--rojo); color: #fff; border: none; padding: 10px 18px; border-radius: 8px;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .barra button.secundario { background: #333; }

  .pagina {
    width: 215.9mm; min-height: 279.4mm; margin: 12mm auto; background: #fff;
    padding: 12mm; box-shadow: 0 0 10px rgba(0,0,0,.25);
    display: flex; flex-direction: column;
  }

  /* ---------- encabezado completo (pagina 1) ---------- */
  .enc-completo { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--rojo); padding-bottom: 12px; margin-bottom: 10px; }
  .enc-completo img { height: 55mm; width: auto; }
  .enc-titulo { text-align: right; }
  .enc-titulo h1 { margin: 0; font-size: 30px; letter-spacing: 2px; color: var(--rojo); font-weight: 800; }
  .enc-meta {
    display: flex; justify-content: space-between; margin-bottom: 7mm; font-size: 12px;
    background: #fcfcfc; border: 1px solid #e2e2e2; border-radius: 8px; padding: 5mm 6mm;
  }
  .enc-meta div { line-height: 2; }
  .enc-meta b { color: var(--negro); font-size: 12.5px; font-weight: 500; }
  .enc-meta .etq { color: var(--gris); font-weight: 600; text-transform: uppercase; letter-spacing: .3px; font-size: 10px; margin-right: 3px; }

  /* ---------- encabezado compacto (pagina 2+) ---------- */
  .enc-compacto {
    display: flex; justify-content: space-between; align-items: center; font-size: 10.5px;
    border-bottom: 1px solid var(--linea); padding-bottom: 4mm; margin-bottom: 4mm; color: var(--gris);
  }
  .enc-compacto b { color: var(--negro); }

  table.tabla-cot { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 10px; table-layout: fixed; }
  table.tabla-cot thead th {
    background: #1f1f1f; color: #fff; text-align: left; padding: 3mm 1.8mm; font-size: 8.5px;
    text-transform: uppercase; letter-spacing: .3px; font-weight: 700;
    border-bottom: 3px solid var(--rojo); border-right: 1px solid rgba(255,255,255,.12);
  }
  table.tabla-cot thead th:last-child { border-right: none; }
  table.tabla-cot thead th:first-child { border-top-left-radius: 8px; }
  table.tabla-cot thead th:last-child { border-top-right-radius: 8px; }
  table.tabla-cot td {
    padding: 2.2mm 1.8mm; border-bottom: 1px solid var(--linea); border-right: 1px solid #eee;
    vertical-align: middle;
  }
  table.tabla-cot td:last-child { border-right: none; }
  table.tabla-cot tbody tr:nth-child(even) { background: #f8f8f8; }
  .col-no { width: 4%; text-align: center; color: var(--gris); }
  .col-codigo { width: 10%; font-family: "Courier New", monospace; font-size: 9.5px; font-weight: 700; }
  .col-inv { width: 7%; text-align: center; font-weight: 700; }
  .col-foto { width: 16%; text-align: center; }
  .col-desc { width: 24%; }
  .col-cant { width: 6%; text-align: center; font-weight: 700; }
  .col-precio { width: 13%; text-align: right; font-size: 11px; }
  .col-pct { width: 6%; text-align: center; color: var(--gris); }
  .col-total { width: 14%; text-align: right; font-weight: 800; font-size: 12px; color: var(--negro); }

  .foto-prod {
    width: 19mm; height: 19mm; object-fit: contain; display: block; margin: 0 auto;
    border: 1px solid var(--linea); border-radius: 2px; background: #fafafa;
  }
  .foto-vacia {
    width: 19mm; height: 19mm; margin: 0 auto; border: 1px dashed var(--linea); border-radius: 2px;
    background: #f5f5f5; display: flex; align-items: center; justify-content: center;
    font-size: 7px; color: #aaa; text-align: center;
  }
  .desc-texto { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
  .inv-agotado { color: #e07b00; font-weight: 700; }
  .inv-disponible { color: #1a7d1a; font-weight: 700; }
  .inv-insuficiente { color: #e07b00; font-weight: 700; }
  .inv-nota { color: #e07b00; font-size: 6.5px; text-transform: uppercase; letter-spacing: .2px; margin-top: .5mm; font-weight: 700; }

  .bloque-totales { margin-top: 6mm; margin-left: auto; width: 62mm; }
  .fila-total { display: flex; justify-content: space-between; font-size: 11px; padding: 1.5mm 1mm; }
  .fila-total .etq { color: var(--gris); font-weight: 600; }
  .fila-total.total-final {
    background: var(--rojo); color: #fff; border-radius: 6px; margin-top: 4px;
    padding: 3mm 3.5mm; font-size: 15px; font-weight: 800;
  }
  .fila-total.total-final .etq { color: #fff; }
  .importe-letra {
    margin-top: 5mm; font-size: 10px; border: 1px solid var(--linea); border-radius: 4px;
    padding: 3mm 4mm; background: #fafafa;
  }
  .importe-letra b { display: block; font-size: 9px; color: var(--gris); margin-bottom: 1.5mm; text-transform: uppercase; }

  .pie-pagina {
    margin-top: auto; padding-top: 3mm; border-top: 1px solid var(--linea);
    display: flex; justify-content: space-between; font-size: 8.5px; color: var(--gris);
  }

  .aviso-vacio { padding: 40px; text-align: center; font-family: Arial, sans-serif; color: #666; }

  @media print {
    body { background: #fff; }
    .barra { display: none !important; }
    .pagina {
      margin: 0; box-shadow: none; width: auto; min-height: auto; padding: 0;
      page-break-after: always;
    }
    .pagina:last-child { page-break-after: auto; }
    tr, .foto-prod, .foto-vacia { break-inside: avoid; page-break-inside: avoid; }
    thead { display: table-header-group; }
    @page { size: letter portrait; margin: 12mm; }
  }
</style>
</head>
<body>
<div class="barra no-imprimir" id="barra">
  <span>Vista previa de la cotización — revisa antes de imprimir.</span>
  <div>
    <button class="secundario" onclick="window.close()">Cerrar</button>
    <button onclick="window.print()">Guardar como PDF</button>
  </div>
</div>
<div id="contenedorPaginas"></div>

<script>
const LOGO_URL = location.origin + "/logo-rogodi.png";
const TELEFONO = "+52 55 1260 0816";
const SITIO_WEB = "www.rogodi.net";

function formatoMoneda(n) {
  return "$" + (n || 0).toLocaleString("es-MX", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ---------- numero a letras (pesos MXN) ----------
const UNIDADES = ["", "UNO", "DOS", "TRES", "CUATRO", "CINCO", "SEIS", "SIETE", "OCHO", "NUEVE"];
const DIECIS = ["DIEZ", "ONCE", "DOCE", "TRECE", "CATORCE", "QUINCE", "DIECISÉIS", "DIECISIETE", "DIECIOCHO", "DIECINUEVE"];
const DECENAS = ["", "", "VEINTE", "TREINTA", "CUARENTA", "CINCUENTA", "SESENTA", "SETENTA", "OCHENTA", "NOVENTA"];
const CENTENAS = ["", "CIENTO", "DOSCIENTOS", "TRESCIENTOS", "CUATROCIENTOS", "QUINIENTOS", "SEISCIENTOS", "SETECIENTOS", "OCHOCIENTOS", "NOVECIENTOS"];

function bloqueALetras(n) {
  if (n === 0) return "";
  if (n === 100) return "CIEN";
  let partes = [];
  const c = Math.floor(n / 100), resto1 = n % 100;
  if (c > 0) partes.push(CENTENAS[c]);
  if (resto1 >= 10 && resto1 < 20) {
    partes.push(DIECIS[resto1 - 10]);
  } else {
    const d = Math.floor(resto1 / 10), u = resto1 % 10;
    if (d === 2 && u > 0) partes.push("VEINTI" + UNIDADES[u]);
    else {
      if (d > 0) partes.push(DECENAS[d]);
      if (u > 0) partes.push(d > 0 ? "Y " + UNIDADES[u] : UNIDADES[u]);
    }
  }
  return partes.join(" ");
}

function enterosALetras(n) {
  if (n === 0) return "CERO";
  if (n === 1) return "UN";
  let partes = [];
  const millones = Math.floor(n / 1000000);
  const miles = Math.floor((n % 1000000) / 1000);
  const cientos = n % 1000;
  if (millones > 0) partes.push((millones === 1 ? "UN MILLÓN" : bloqueALetras(millones) + " MILLONES"));
  if (miles > 0) partes.push((miles === 1 ? "MIL" : bloqueALetras(miles) + " MIL"));
  if (cientos > 0) partes.push(bloqueALetras(cientos));
  return partes.join(" ") || "CERO";
}

function dosDigitosALetras(n) {
  if (n === 0) return "CERO";
  if (n < 10) return UNIDADES[n];
  if (n < 20) return DIECIS[n - 10];
  const d = Math.floor(n / 10), u = n % 10;
  if (d === 2 && u > 0) return "VEINTI" + UNIDADES[u];
  return u > 0 ? `${DECENAS[d]} Y ${UNIDADES[u]}` : DECENAS[d];
}

function importeALetras(total) {
  const entero = Math.floor(total + 1e-6);
  const centavos = Math.round((total - entero) * 100);
  const parteCentavos = centavos > 0 ? ` CON ${dosDigitosALetras(centavos)} CENTAVOS` : "";
  return `${enterosALetras(entero)} PESOS${parteCentavos} M.N.`;
}

// ---------- carga de datos ----------
let datos = null;
try { datos = JSON.parse(sessionStorage.getItem("rogodi_cotizacion_pdf") || "null"); } catch (e) { datos = null; }

const cont = document.getElementById("contenedorPaginas");
if (!datos || !datos.items || !datos.items.length) {
  cont.innerHTML = `<div class="aviso-vacio">No hay datos de cotización para mostrar.<br>Cierra esta pestaña y genera el PDF desde el carrito del buscador.</div>`;
} else {
  construirPaginas(datos);
}

function construirPaginas(d) {
  const fecha = new Date(d.fechaISO);
  const vigenteHasta = new Date(fecha.getTime() + 24 * 60 * 60 * 1000);
  const fmtFecha = (dt) => dt.toLocaleDateString("es-MX", { day: "2-digit", month: "2-digit", year: "numeric" });
  const fmtFechaHora = (dt) => dt.toLocaleString("es-MX", { day: "2-digit", month: "2-digit", year: "numeric", hour: "numeric", minute: "2-digit" });

  // --- presupuesto de espacio por pagina (en mm) ---
  const CONTENT_H = 255.4; // 279.4 - 2*12 de margen
  const HEADER_FULL_H = 74, HEADER_COMPACT_H = 14, THEAD_H = 10, FOOTER_H = 10, ROW_H = 24, TOTALES_H = 38;
  const budgetPag1 = CONTENT_H - HEADER_FULL_H - THEAD_H - FOOTER_H;
  const budgetPagN = CONTENT_H - HEADER_COMPACT_H - THEAD_H - FOOTER_H;

  // --- empaquetar filas en paginas ---
  const paginas = []; // cada una: { filas: [...], conTotales: bool }
  let filasRestantes = d.items.slice();
  let esPrimera = true;
  while (filasRestantes.length || !paginas.length) {
    const budget = esPrimera ? budgetPag1 : budgetPagN;
    const maxFilas = Math.max(1, Math.floor(budget / ROW_H));
    const filas = filasRestantes.splice(0, maxFilas);
    paginas.push({ filas, conTotales: false });
    esPrimera = false;
    if (!filasRestantes.length) break;
  }
  // decidir donde van los totales: si caben junto a la ultima tanda de filas, ahi; si no, pagina nueva
  const ultima = paginas[paginas.length - 1];
  const budgetUltima = paginas.length === 1 ? budgetPag1 : budgetPagN;
  const usadoUltima = ultima.filas.length * ROW_H;
  if (budgetUltima - usadoUltima >= TOTALES_H) {
    ultima.conTotales = true;
  } else {
    paginas.push({ filas: [], conTotales: true });
  }

  const totalPaginas = paginas.length;
  let numeroBase = 0;
  const html = paginas.map((pag, idx) => {
    const pagHtml = renderPagina(d, pag, idx + 1, totalPaginas, numeroBase, fecha, vigenteHasta, fmtFecha, fmtFechaHora);
    numeroBase += pag.filas.length;
    return pagHtml;
  }).join("");
  cont.innerHTML = html;
}

function filaProducto(it, numero, descuentoPct) {
  const foto = it.foto_url
    ? `<img class="foto-prod" src="${escapeHtml(it.foto_url)}" onerror="this.outerHTML='<div class=&quot;foto-vacia&quot;>Sin foto</div>'">`
    : `<div class="foto-vacia">Sin foto</div>`;
  let inv;
  if (it.existencia === null || it.existencia === undefined) {
    inv = "-";
  } else if (it.existencia <= 0) {
    inv = `<span class="inv-agotado">Agotado</span>`;
  } else if (it.existencia < it.cantidad) {
    inv = `<span class="inv-insuficiente">${Math.trunc(it.existencia)}</span><div class="inv-nota">Insuficiente</div>`;
  } else {
    inv = `<span class="inv-disponible">${Math.trunc(it.existencia)}</span>`;
  }
  return `<tr>
    <td class="col-no">${numero}</td>
    <td class="col-codigo">${escapeHtml(it.codigo)}</td>
    <td class="col-inv">${inv}</td>
    <td class="col-foto">${foto}</td>
    <td class="col-desc"><div class="desc-texto">${escapeHtml(it.descripcion)}</div></td>
    <td class="col-cant">${it.cantidad}</td>
    <td class="col-precio">${formatoMoneda(it.precioUnit)}</td>
    <td class="col-pct">${descuentoPct > 0 ? descuentoPct + "%" : "-"}</td>
    <td class="col-total">${formatoMoneda(it.subtotal)}</td>
  </tr>`;
}

function bloqueTotales(d) {
  const descuentoMonto = d.subtotal - d.total;
  return `<div class="bloque-totales">
    <div class="fila-total"><span class="etq">Subtotal</span><span>${formatoMoneda(d.subtotal)}</span></div>
    <div class="fila-total"><span class="etq">Descuento${d.descuentoPct > 0 ? " (" + d.descuentoPct + "%)" : ""}</span><span>${formatoMoneda(descuentoMonto)}</span></div>
    <div class="fila-total total-final"><span>Total</span><span>${formatoMoneda(d.total)}</span></div>
  </div>
  <div class="importe-letra"><b>Importe con letra</b>${importeALetras(d.total)}</div>`;
}

function renderPagina(d, pag, numPagina, totalPaginas, numeroBase, fecha, vigenteHasta, fmtFecha, fmtFechaHora) {
  const encabezado = numPagina === 1
    ? `<div class="enc-completo">
         <img src="${LOGO_URL}" alt="ROGODI">
         <div class="enc-titulo"><h1>COTIZACIÓN</h1></div>
       </div>
       <div class="enc-meta">
         <div>
           <div><span class="etq">Cliente:</span> <b>${escapeHtml(d.cliente || "-")}</b></div>
           <div><span class="etq">Agente:</span> <b>${escapeHtml(d.agente || "-")}</b></div>
         </div>
         <div style="text-align:right">
           <div><span class="etq">Fecha:</span> <b>${fmtFecha(fecha)}</b></div>
           <div><span class="etq">Vigente hasta:</span> <b>${fmtFechaHora(vigenteHasta)}</b></div>
         </div>
       </div>`
    : `<div class="enc-compacto">
         <div><b>ROGODI MÉXICO</b> — Cliente: ${escapeHtml(d.cliente || "-")}</div>
         <div>Página ${numPagina} de ${totalPaginas}</div>
       </div>`;

  const tabla = pag.filas.length
    ? `<table class="tabla-cot">
        <colgroup>
          <col class="col-no"><col class="col-codigo"><col class="col-inv"><col class="col-foto">
          <col class="col-desc"><col class="col-cant"><col class="col-precio"><col class="col-pct"><col class="col-total">
        </colgroup>
        <thead>
          <tr>
            <th>No.</th><th>Código</th><th>Inventario</th><th>Foto</th><th>Descripción del artículo</th>
            <th>Cant.</th><th>Precio neto c/IVA</th><th>%</th><th>Total</th>
          </tr>
        </thead>
        <tbody>
          ${pag.filas.map((it, i) => filaProducto(it, numeroBase + i + 1, d.descuentoPct)).join("")}
        </tbody>
      </table>`
    : "";

  const totales = pag.conTotales ? bloqueTotales(d) : "";

  return `<div class="pagina">
    ${encabezado}
    ${tabla}
    ${totales}
    <div class="pie-pagina">
      <span>${TELEFONO} · ${SITIO_WEB}</span>
      <span>Página ${numPagina} de ${totalPaginas}</span>
    </div>
  </div>`;
}
</script>
</body>
</html>
